# Risk triggers (D4) — deterministic, table-driven, evaluated BEFORE model judgment.
#
# The PM may only ever ADD gates beyond what this table produces, and only with
# a recorded reason. It may never subtract one. That is what makes identical
# requests produce identical mandatory staffing, and what means Riyan never has
# to remember to ask for a security review.
#
# A trigger fires when a task's owned globs match `paths`, OR when the request
# text matches any of `keywords` (case-insensitive, word boundary).

triggers:
  - name: authentication
    keywords: [auth, authentication, login, signin, sign-in, session, token, jwt, oauth, sso, saml]
    paths: ["**/auth/**", "**/authentication/**", "**/session/**"]
    gates: [review, qa, security]

  - name: authorization
    keywords: [authorization, permission, permissions, rbac, role, roles, access control, acl, privilege, approver, approval]
    paths: ["**/auth/**", "**/permissions/**", "**/rbac/**", "**/roles/**", "**/approvals/**"]
    gates: [review, qa, security]

  - name: secrets
    keywords: [secret, secrets, credential, credentials, api key, private key, encryption, encrypt, decrypt, vault]
    paths: ["**/secrets/**", "**/.env*", "**/keys/**"]
    gates: [review, security]

  - name: payments
    keywords: [payment, payments, billing, invoice, charge, refund, subscription, stripe, checkout]
    paths: ["**/payment*/**", "**/billing/**", "**/invoice*/**"]
    gates: [review, qa, security]

  - name: pii
    keywords: [pii, personal data, gdpr, ssn, aadhaar, passport, date of birth, medical, health record]
    paths: ["**/pii/**", "**/personal/**"]
    gates: [review, qa, security]

  - name: file-upload
    keywords: [upload, file upload, attachment, parse file, csv import, xml parse, deserialize]
    paths: ["**/upload*/**", "**/attachments/**", "**/import*/**"]
    gates: [review, qa, security]

  - name: webhooks
    keywords: [webhook, webhooks, callback url, signature verification]
    paths: ["**/webhook*/**"]
    gates: [review, security]

  - name: database-migration
    keywords: [migration, migrations, alter table, drop column, schema change, backfill]
    paths: ["**/migrations/**", "**/alembic/**", "**/schema/**"]
    gates: [review, qa, security]

  - name: infrastructure
    keywords: [terraform, iam, production deploy, kubernetes, helm, cloudformation, security group]
    paths: ["infra/**", "**/terraform/**", "**/.github/workflows/**", "**/k8s/**"]
    gates: [review, security]

  - name: multi-tenancy
    keywords: [tenant, multi-tenant, customer isolation, org scoping, workspace isolation]
    paths: ["**/tenant*/**"]
    gates: [review, qa, security]

  - name: external-api-credentials
    keywords: [external api, third party api, integration credentials, service account]
    paths: ["**/integrations/**", "**/connectors/**"]
    gates: [review, security]

  # CISO found this gap by whole-repo audit, not any single task's diff: none
  # of the triggers above cover a change to the enforcement mechanism itself.
  # A task editing a hook, the gate table, or the risk table would otherwise
  # ship with only baseline_gates — one reviewer, no security gate — despite
  # touching the exact code that decides who else gets reviewed.
  - name: governance-mechanism
    keywords: [pretooluse hook, guard_paths, guard_secrets, protect_branches,
              quality-gates.yaml, risk-triggers.yaml, allowedtools, role_tools]
    paths: ["hooks/**", "config/quality-gates.yaml", "config/risk-triggers.yaml",
           "**/worker.py"]
    gates: [review, security]

  # A worker with Bash/Write access fetching content it does not control
  # (WebFetch, a webhook payload, third-party MCP/skill output) is the
  # dominant 2026 attack class against coding agents — prompt injection via
  # untrusted content the agent then acts on. "webhooks" above only covers
  # BUILDING a webhook handler; this covers a worker CONSUMING untrusted
  # content as part of its own task.
  - name: untrusted-content
    keywords: [webfetch, fetch url, scrape, third-party content, ingest,
              external content, mcp server, browse, fetch and summarize]
    gates: [review, security]

# Gates applied to every task regardless of trigger. Empty on purpose (D10,
# efficiency addendum v1): review is risk-based now, same as qa/security, not
# universal. A docs change with no trigger hit is author -> hook-verified ->
# DONE, no review event required. Adding review back on an untriggered task
# is a scope addition like any other and needs a recorded reason —
# `staffing.reconcile()` already drops an unreasoned addition, so this list
# being empty is the only change needed to make that apply to review too.
baseline_gates: []

# Fast path (D9, efficiency addendum v1): a request with zero risk-trigger
# hits and a diff within these bounds is Tier 0 by default — the PM does it
# inline, no staffing pipeline, no gates. This is evaluated by
# `staffing.evaluate()` when the caller supplies file/line counts (e.g.
# `company gates --files-touched N --diff-lines N`); without those counts,
# fast_path only reports whether triggers fired, same as before. Escalating
# past Tier 0 despite fast_path applying needs the same recorded reason a
# gate addition needs — never a default "just in case".
fast_path:
  enabled: true
  max_files_touched: 1
  max_diff_lines: 50
