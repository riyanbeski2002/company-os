# Model/effort policy by tier (D11 / §2, efficiency addendum v1).
#
# The single biggest cost lever: a bigger model or higher effort multiplies
# every other cost, and most Tier 0/1 work is mechanical, not ambiguous.
# Escalate model/effort UP only when the risk table or a recorded judgment
# call says so — never as a default "just in case", same discipline as D9's
# tier escalation and D4's gate additions.
#
# Tier 0 has no CLI launch (the PM does it inline) so its row is read by the
# PM directly, not by worker.py — it exists so the policy is documented in
# one place instead of split between config and prose.
#
# `worker.py` reads the tier2_ungated/tier2_gated/tier1 rows to set
# `--model`/`--effort` on every `claude -p` launch, and `thinking: off` rows
# set `MAX_THINKING_TOKENS=0` in the worker's environment (no CLI flag for
# thinking exists as of Claude Code v2.1.239).

policy:
  # The PM's own session model — separate from tier0 (which is Tier-0 *work*,
  # read by the PM but not a launch flag). This row is what `claude --agent
  # company-pm` should launch with. Not read by any code today (session model
  # is chosen at launch, outside worker.py) — it exists so the policy is
  # written down and the next session has something to check against, the
  # same reasoning tier0's note already gives for staying documented even
  # unread. Decided 2026-09-11 (Riyan) after one PM session ran on
  # `opus[1m]` for 3 days without a /clear: 850 turns, context grew to 562k
  # (85% of all cache-read tokens spent above the 200k long-context line),
  # ~$478 for coordination — more than all 46 Sonnet Tier-2 workers on the
  # same project combined ($58). Escalate to opus by hand for a genuine
  # architecture or staffing call, then back — that's a small fraction of
  # turns, not the default.
  pm_session:
    model: sonnet
    context: 200k   # not opus[1m] — the smaller ceiling forces a compact
                     # instead of letting context run to 500k+ unattended.
    note: "claude --agent company-pm launch model. Escalate to opus per-turn on demand, never as the session default."

  tier0:
    model: sonnet
    effort: low
    thinking: off
    note: "PM inline, mechanical edits — read by the PM, not launched by worker.py"

  tier1:
    model: sonnet
    effort: medium
    thinking: on

  tier2_ungated:
    model: sonnet
    effort: medium
    thinking: on

  tier2_gated:
    model: sonnet
    effort: high
    thinking: on
    # Changed from opus 2026-08-24, decided by Riyan directly (cost discipline:
    # "no extensive use of Opus for things sonnet can do"), reinforced by an
    # active Anthropic Opus-specific outage that stalled 6 gated tasks the same
    # session this was decided. Effort stays high — only the model changed.
    # If gate quality regresses on genuinely hard reviews, escalate back up
    # per-task via a recorded judgment call, not by reverting this default.

# Per-role overrides on top of the tier/gated row above (2026-08-25, cost
# audit — `company costs` showed code-reviewer and qa-engineer as the two
# largest gate-cost lines, both riding the same tier2_gated row
# security-reviewer uses, despite being read-mostly judgment work rather
# than the highest-stakes case that row exists for). Only the fields listed
# here change; model and thinking stay whatever the base row says. Widen
# an override only with a recorded reason (a real regression on a genuinely
# hard review), never as a default "just in case" — same discipline as
# everything else in this file.
role_overrides:
  code-reviewer:
    effort: medium
  qa-engineer:
    effort: medium
  # security-reviewer deliberately NOT overridden — it stays on the full
  # tier2_gated row. It wasn't the cost complaint, and it's the one role
  # here whose job is specifically to catch what a faster pass would miss.
