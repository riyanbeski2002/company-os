    kind: agent
    ref: video-editor
    use_when: "The outcome is genuinely a rendered video/motion-graphics deliverable, not a static image or a UI screen."
    not_when: "A static image (frontend-engineer + claude-image-generation) or a UI screen."
    provides: [video_build]
    trust: T0
