# Capability registry — what has been vetted, by whom, and when.
#
# 2026-08-24: this is now company-os's own canonical, public registry, not a
# per-repo template. It used to be blank here (see git history) specifically
# so a company-os-specific approval couldn't leak into another repo's
# .company/config/ via `company init`'s copy-if-not-exists — Riyan then asked
# for the opposite: this list made visibly public instead of buried in the
# dot-prefixed .company/ folder. Both concerns are real, so `cmd_init`
# (tools/company/cli.py) now excludes this one file from the config/ ->
# .company/config/ auto-copy that every other file here still gets — a newly
# onboarded repo starts with its OWN empty registry (write one directly into
# ITS .company/config/capability-registry.yaml, same flow as always), never a
# silent inherited copy of these 51+ entries. This file stays the visible,
# single source of truth for what Riyan has actually vetted.
#
# Written to ONLY by company-pm, and only after Riyan approves a proposal
# raised through the `capability-curator` skill (see skills/capability-curator/
# SKILL.md). Every other role is read-only against this file by construction —
# a proposal that could silently self-approve is not a proposal.
#
# Trust tiers, from skills/capability-curator/SKILL.md:
#   T0 Company OS itself   T1 Anthropic official   T2 pinned trusted third party
#   T3 community/experimental (manual use only)    T4 unknown (reference only)
#
# An entry looks like:
#
# entries:
#   - id: example-resource
#     type: skill | mcp-server | library | component-registry
#     purpose: "one line — what it's for and why it was proposed"
#     trust_tier: T2
#     source: "github.com/owner/repo"
#     license: MIT
#     approved_by: riyan
#     approved_at: "2026-08-16"
#     checked_at: "2026-08-16"

