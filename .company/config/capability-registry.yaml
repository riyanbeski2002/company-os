# Capability registry — what has been vetted for THIS repo, by whom, and when.
#
# Written to ONLY by company-pm, and only after Riyan approves a proposal
# raised through the `capability-curator` skill (see skills/capability-curator/
# SKILL.md). Every other role is read-only against this file by construction —
# a proposal that could silently self-approve is not a proposal.
#
# Trust tiers, from skills/capability-curator/SKILL.md:
#   T0 Company OS itself   T1 Anthropic official   T2 pinned trusted third party
#   T3 community/experimental (manual use only)    T4 unknown (reference only)
#
# Empty on a fresh repo. An entry looks like:
#
# entries:
#   - id: example-resource
#     type: skill | mcp-server | library | component-registry
#     purpose: "one line — what it's for and why it was proposed"
#     trust_tier: T2
#     source: "github.com/owner/repo"
#     license: MIT
#     approved_by: riyan
#     approved_at: "2026-08-16"
#     checked_at: "2026-08-16"

entries:
  - id: motion-vocabulary
    type: skill
    purpose: "Precise motion/animation terminology and defaults for frontend-engineer, so a motion choice can be justified concretely (a named easing, a stated reason) instead of by taste alone."
    trust_tier: T2
    source: "https://motion-vocabulary.vercel.app/ (terminology adapted from animations.dev)"
    license: "reference terminology only — skill content is an original write-up, not a verbatim copy; re-verify source terms before any different reuse"
    approved_by: riyan
    approved_at: "2026-08-17"
    checked_at: "2026-08-17"
  - id: scroll-animation
    type: skill
    purpose: "Research and present multiple scroll-driven-narrative production pipelines (frame-sequenced video, CSS scroll-timeline, JS scroll-linked libraries, Lottie, WebGL, SVG morph) instead of defaulting to one, and split delegated work into autonomous vs. Riyan-needed steps."
    trust_tier: T0
    source: "authored in this repo, requested by riyan"
    license: "original"
    approved_by: riyan
    approved_at: "2026-08-17"
    checked_at: "2026-08-17"
  - id: anthropics-financial-services-plugins
    type: plugin
    purpose: "Backing methodology (DCF, LBO, comps, 3-statement models, pitch decks) for the new finance-analyst agent — real deal/finance deliverables, not company-os's own cost auditing. Matches active finance work (tds-reco, fin-comp, finos)."
    trust_tier: T1
    source: "https://github.com/anthropics/financial-services-plugins"
    license: "Apache-2.0"
    approved_by: riyan
    approved_at: "2026-08-17"
    checked_at: "2026-08-17"
  - id: anthropics-knowledge-work-plugins-legal
    type: plugin
    purpose: "Backing methodology (contract review against a negotiation playbook, NDA triage) for the new legal-analyst agent. Assists, never replaces, licensed counsel — every legal-analyst deliverable states this explicitly."
    trust_tier: T1
    source: "https://github.com/anthropics/knowledge-work-plugins/tree/main/legal"
    license: "Apache-2.0"
    approved_by: riyan
    approved_at: "2026-08-17"
    checked_at: "2026-08-17"
