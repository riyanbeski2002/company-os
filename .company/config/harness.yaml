# BYO-model harness registry (tools/company/harness.py has the full contract
# an alternate harness must satisfy, and doc/BYO-MODEL.md has a worked
# example of wiring a second one in).
#
# `default` is the harness every role launches with unless overridden below.
# Pointing a role at a different backend is the entire integration surface —
# no worker.py edit required.

default: claude

roles: {}
  # Example override, left empty — codex was validated against a real
  # cfo-advisor run (2026-10-19, see tasks/lessons.md) by staffing it here
  # temporarily and reverting afterward; staffing a role onto a harness by
  # default is a separate, later choice from proving the harness works.
  # backend-engineer: my-other-cli

harnesses:
  claude:
    # This is the exact command worker.py hardcoded before the harness seam
    # existed — kept byte-for-byte so the default behavior never changed.
    # `--agent` is what makes a Tier-2 launch affordable: the named agent
    # file's `tools:` list removes every other tool DEFINITION from context,
    # not just permission to call it (measured on this machine: 36,151
    # tokens of base context with no agent, 6,016 with a six-tool agent —
    # re-read on every turn). native_agent_loading is true for exactly that
    # reason: Claude Code loads agents/<role>.md itself, so worker.py must
    # not also fold its body into the packet.
    native_agent_loading: true
    output: claude-json
    binary: claude
    # Capability states (migration doc §2): from `--help`/installed docs, not
    # memory. --settings sandbox verified on 2.1.308 (see settings_flag).
    verified_with: "claude 2.1.308"
    capabilities:
      headless: SUPPORTED              # -p
      stdin_prompt: SUPPORTED
      json_output: SUPPORTED           # --output-format json
      schema_output: SUPPORTED         # --json-schema
      model_select: SUPPORTED          # --model
      effort: SUPPORTED                # --effort
      resume: SUPPORTED                # --resume / --session-id
      blocking_pre_tool_hook: SUPPORTED  # PreToolUse permissionDecision deny
      persona_files: SUPPORTED         # --agent
      os_sandbox: SUPPORTED            # --settings sandbox (Seatbelt)
      tool_allowlist: SUPPORTED        # --allowedTools
      mcp: SUPPORTED
      byok: SUPPORTED                  # ANTHROPIC_BASE_URL, Bedrock/Vertex
      cost_reporting: SUPPORTED        # total_cost_usd (an estimate)
    command:
      - claude
      - -p
      - --agent
      - "{role}"
      - --plugin-dir
      - "{plugin_root}"
      - --strict-mcp-config
      - --output-format
      - json
      - --json-schema
      - "{schema_json}"
      - --permission-mode
      - acceptEdits
      - --allowedTools
      - "{allowed_tools}"
    model_flag: --model
    effort_flag: --effort
    skip_permissions_flag: --dangerously-skip-permissions
    # Carries worker.sandbox_settings() inline (`--settings` takes a file or
    # a JSON string, verified on 2.1.308): Claude Code's own OS sandbox
    # (Seatbelt on macOS) confining every Bash call's writes to the launch
    # cwd plus the few .company/ dirs the `company` CLI writes. Bash
    # hooks alone (protect_branches.py) can't see through `cd`, `../`, or
    # `python3 -c` — the kernel can.
    settings_flag: --settings
    # An ANTHROPIC_API_KEY in the environment silently takes precedence over
    # the claude.ai login and returns terminal_reason "api_error" with zero
    # tokens consumed (verified on this machine) — workers must run on the
    # subscription session, so these are always stripped before launch.
    strip_env:
      - ANTHROPIC_API_KEY
      - ANTHROPIC_AUTH_TOKEN
      - CLAUDE_CODE_SESSION_ID
      - CLAUDE_CODE_CHILD_SESSION
      - CLAUDE_CODE_ENTRYPOINT

  # Second real harness (2026-10-19). The invocation and event shapes below
  # were read from paperclip's own codex-local adapter source (packages/
  # adapters/codex-local/src/server/{codex-args.ts,parse.ts}), then
  # smoke-tested end-to-end on this machine (codex-cli 0.163.0) before being
  # committed — not guessed. `codex exec --json` streams JSONL events, not
  # one final object; adapters/codex.py normalizes them (`output:` below).
  # Its reply shape is still unconstrained: `--output-schema <file>` exists
  # on 0.163.0 but hasn't been live-tested here yet (migration M3).
  #
  # Not yet staffed to any role (see `roles:` above) — it exists, is real,
  # and is covered by tests/test_harness.py, but switching a real role onto
  # it is a deliberate choice for later, not a default this commit makes.
  codex:
    # No --agent equivalent exists; worker.py folds agents/<role>.md into
    # the packet itself (same as any other native_agent_loading: false
    # harness). One thing to watch that doesn't apply to any harness
    # before this one: Codex ALSO auto-loads a worktree's own AGENTS.md if
    # one exists, on top of whatever persona text worker.py prepended
    # (paperclip's own comment, execute.ts:1136) — a role whose worktree
    # happens to contain an AGENTS.md could pick up unintended extra
    # instructions. Not guarded against here; watch for it if this harness
    # gets staffed to a role whose repo has one.
    native_agent_loading: false
    # Runs `codex exec` directly (2026-10-30, migration M1): this is
    # byte-for-byte the argv tools/company/adapters/codex_adapter.py used to
    # exec, so the live-tested invocation is unchanged — only the JSONL
    # parsing moved in-process (adapters/codex.py, selected by `output:`).
    # The script remains as a shim for older .company/config copies.
    output: codex-jsonl
    binary: codex
    verified_with: "codex-cli 0.163.0"
    capabilities:
      headless: SUPPORTED              # codex exec
      stdin_prompt: SUPPORTED          # `-`
      json_output: SUPPORTED           # --json (JSONL)
      schema_output: SUPPORTED         # --output-schema <file>; not yet used
      model_select: SUPPORTED          # -m; account catalog unconfirmed
      effort: REQUIRES_CONFIGURATION   # -c model_reasoning_effort=
      resume: SUPPORTED                # exec resume <id>
      blocking_pre_tool_hook: SUPPORTED  # needs trust; shim unverified live
      persona_files: UNKNOWN           # AGENTS.md (binary strings only)
      os_sandbox: SUPPORTED            # -c sandbox_mode=workspace-write
      tool_allowlist: UNKNOWN          # no flag; execpolicy rules only
      mcp: SUPPORTED
      byok: SUPPORTED                  # model_providers, --oss local
      cost_reporting: UNSUPPORTED      # tokens only
    # Guards (2026-10-30, migration M2): hooks/guard.py is registered as this
    # run's PreToolUse hook via a session-flag config layer (`-c`; codex lists
    # "Session flags" as a hook source). --dangerously-bypass-hook-trust is
    # required headless: codex otherwise SKIPS an untrusted hook silently.
    # Known cost of that flag: it also runs any hooks the worked-on repo ships
    # in its own .codex/ config without review — weigh that before staffing
    # codex onto an untrusted repo.
    #
    # NOT YET VERIFIED LIVE (no guards_verified), so harness.require_guards
    # refuses every codex launch until a real run shows the hook firing and
    # denying — the inline-TOML hook shape and the tool names that reach it
    # were read from the binary, not observed.
    guards: shim
    command:
      - codex
      - exec
      - --json
      - --skip-git-repo-check
      - --dangerously-bypass-hook-trust
      - -c
      - sandbox_mode="workspace-write"
      - -c
      - sandbox_workspace_write.network_access=false
      - -c
      - hooks.PreToolUse=[{matcher=".*", hooks=[{type="command", command="python3 '{plugin_root}/hooks/guard.py' codex", timeout=30}]}]
    # `-` = read the prompt from stdin; must come after the effort flag
    # build_command appends, as the wrapper's own argv had it.
    trailing_args: ["-"]
    # No --settings equivalent; the two `-c sandbox_*` lines above are this
    # harness's own containment, so harness.build_command doesn't refuse it.
    self_sandboxed: true
    # model_flag is deliberately UNSET. staffing.yaml's tier policy names
    # Claude model families (sonnet/opus/haiku); this account's valid Codex
    # model catalog is not confirmed (live-tested 2026-10-19: `gpt-5.1-codex`
    # was rejected outright as "not supported... with a ChatGPT account").
    # Shipping a guessed model_map here would silently fail real launches —
    # worse than this harness always using Codex's own account-default
    # model regardless of tier. Confirm the real catalog (`codex doctor`, or
    # reading a live rejection's error text) before adding model_flag back.
    effort_flag: -c
    # staffing.yaml's low/medium/high effort names already match Codex's own
    # vocabulary (minimal/low/medium/high/xhigh) — no renaming needed, just
    # the `-c model_reasoning_effort=<value>` wrapping. "low" was live-tested
    # or confirmed effective 2026-10-19; medium/high were not separately
    # exercised.
    effort_map:
      low: model_reasoning_effort=low
      medium: model_reasoning_effort=medium
      high: model_reasoning_effort=high
    strip_env: []

  # Catalogued only (M3, 2026-10-30): capabilities recorded from `--help`
  # and installed docs; no `command`, because no invocation or output shape
  # has been observed in a live run yet — harness.resolve refuses them by
  # name. Neither CLI documents its print-mode JSON, so an output adapter
  # needs one recorded real run each (Riyan's approval: it spends tokens).
  agy:
    binary: agy
    # Not on PATH by default; ~/.antigravity/antigravity/bin/agy is a
    # dangling symlink on this machine.
    binary_paths: ["~/.gemini/bin/agy"]
    verified_with: "agy 1.4.11"
    capabilities:
      headless: SUPPORTED              # -p / --print
      stdin_prompt: UNKNOWN            # stream-json stdin only, documented
      json_output: SUPPORTED           # --output-format json (shape unknown)
      schema_output: SUPPORTED         # --json-schema
      model_select: SUPPORTED          # --model; `agy models`
      effort: SUPPORTED                # --effort
      resume: SUPPORTED                # --conversation <id>
      blocking_pre_tool_hook: SUPPORTED  # .agents/hooks.json, decision: deny;
                                       # hooks/guard.py agy translates it
      persona_files: SUPPORTED         # --agent, .agents/agents
      os_sandbox: UNKNOWN              # --sandbox exists; behavior unverified
      tool_allowlist: UNKNOWN
      mcp: SUPPORTED
      byok: UNKNOWN
      cost_reporting: UNKNOWN
  opencode:
    binary: opencode
    verified_with: "opencode 2.2.2"
    capabilities:
      headless: SUPPORTED              # opencode run
      stdin_prompt: UNKNOWN
      json_output: SUPPORTED           # run --format json (shape unknown)
      schema_output: UNKNOWN
      model_select: SUPPORTED          # -m provider/model; `opencode models`
      effort: REQUIRES_CONFIGURATION   # model #variant suffix
      resume: SUPPORTED                # -s <id>
      # No blocking pre-tool hook found on v2.2.2 (v1's tool.execute.before
      # is absent from the binary). Without one it can never be guards: shim
      # — only `external`, or not launched at all.
      blocking_pre_tool_hook: UNKNOWN
      persona_files: SUPPORTED         # run --agent
      os_sandbox: UNKNOWN              # none found
      tool_allowlist: REQUIRES_CONFIGURATION  # config permissions only
      mcp: SUPPORTED
      byok: SUPPORTED                  # baseURL, openai-compatible providers
      cost_reporting: UNKNOWN

  # Template for a THIRD backend — commented out rather than guessed-and-
  # shipped, same discipline as `codex` above was held to before it was
  # real. Copy this, point `command` at the real CLI (or a thin adapter
  # script if it can't natively satisfy harness.py's output contract), and
  # flip `native_agent_loading` to false unless that CLI has its own
  # `--agent`-equivalent persona loader.
  #
  # generic-example:
  #   native_agent_loading: false
  #   command: ["/path/to/adapter-script", "--role", "{role}"]
  #   model_flag: --model
  #   effort_flag: --effort
  #   model_map:
  #     sonnet: gpt-5.1
  #     opus: gpt-5.1-high
  #     haiku: gpt-5.1-mini
  #   effort_map:
  #     medium: standard
  #   strip_env: []
