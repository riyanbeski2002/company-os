# Risk triggers (D4) — deterministic, table-driven, evaluated BEFORE model judgment.
#
# The PM may only ever ADD gates beyond what this table produces, and only with
# a recorded reason. It may never subtract one. That is what makes identical
# requests produce identical mandatory staffing, and what means Riyan never has
# to remember to ask for a security review.
#
# A trigger fires when a task's owned globs match `paths`, OR when the request
# text matches any of `keywords` (case-insensitive, word boundary).
#
# `presentational_paths` (Riyan, 2026-10-19 — "a UI landing page with 'auth'
# written... should not trigger security, waste of effort"): when a trigger's
# ONLY hit is a keyword match in the request text (no path corroboration for
# that trigger), and every one of the task's owned paths matches one of these
# patterns, that specific trigger is downgraded instead of forced — the task
# still gets `review` via baseline_gates, just not qa/security from a false
# positive. A real path hit (the keyword also matches the trigger's own
# `paths` list) is NEVER downgraded regardless of this list; this only
# narrows the free-text-keyword-alone case. Extend this list deliberately,
# not broadly — it should name genuinely content-only locations (copy,
# marketing text, landing pages), never a directory that could plausibly
# hold real logic (a form component, a page with client-side validation).
presentational_paths:
  - "**/content/**"
  - "**/copy/**"
  - "**/marketing/**"
  - "**/landing/**"
  - "**/*.copy.ts"
  - "**/*.copy.tsx"
  - "**/*.copy.js"
  - "**/*.copy.jsx"
  - "**/locales/**"
  - "**/i18n/**"

triggers:
  - name: authentication
    keywords: [auth, authentication, login, signin, sign-in, session, token, jwt, oauth, sso, saml]
    paths: ["**/auth/**", "**/authentication/**", "**/session/**"]
    gates: [review, qa, security]

  - name: authorization
    keywords: [authorization, permission, permissions, rbac, role, roles, access control, acl, privilege, approver, approval]
    paths: ["**/auth/**", "**/permissions/**", "**/rbac/**", "**/roles/**", "**/approvals/**"]
    gates: [review, qa, security]

  - name: secrets
    keywords: [secret, secrets, credential, credentials, api key, private key, encryption, encrypt, decrypt, vault]
    paths: ["**/secrets/**", "**/.env*", "**/keys/**"]
    gates: [review, security]

  - name: payments
    keywords: [payment, payments, billing, invoice, charge, refund, subscription, stripe, checkout]
    paths: ["**/payment*/**", "**/billing/**", "**/invoice*/**"]
    gates: [review, qa, security]

  - name: pii
    keywords: [pii, personal data, gdpr, ssn, aadhaar, passport, date of birth, medical, health record]
    paths: ["**/pii/**", "**/personal/**"]
    gates: [review, qa, security]

  - name: file-upload
    keywords: [upload, file upload, attachment, parse file, csv import, xml parse, deserialize]
    paths: ["**/upload*/**", "**/attachments/**", "**/import*/**"]
    gates: [review, qa, security]

  - name: webhooks
    keywords: [webhook, webhooks, callback url, signature verification]
    paths: ["**/webhook*/**"]
    gates: [review, security]

  - name: database-migration
    keywords: [migration, migrations, alter table, drop column, schema change, backfill]
    paths: ["**/migrations/**", "**/alembic/**", "**/schema/**"]
    gates: [review, qa, security]

  - name: infrastructure
    keywords: [terraform, iam, production deploy, kubernetes, helm, cloudformation, security group]
    paths: ["infra/**", "**/terraform/**", "**/.github/workflows/**", "**/k8s/**"]
    gates: [review, security]

  - name: multi-tenancy
    keywords: [tenant, multi-tenant, customer isolation, org scoping, workspace isolation]
    paths: ["**/tenant*/**"]
    gates: [review, qa, security]

  - name: external-api-credentials
    keywords: [external api, third party api, integration credentials, service account]
    paths: ["**/integrations/**", "**/connectors/**"]
    gates: [review, security]

  # CISO found this gap by whole-repo audit, not any single task's diff: none
  # of the triggers above cover a change to the enforcement mechanism itself.
  # A task editing a hook, the gate table, or the risk table would otherwise
  # ship with only baseline_gates — one reviewer, no security gate — despite
  # touching the exact code that decides who else gets reviewed.
  # 2026-08-24: extended to cover staffing.py/cli.py/staffing.yaml, which the
  # efficiency addendum (D9-D11, commit 6f2fea7) introduced without adding
  # them here — CTO audit caught this same-day: a 12-line edit to
  # fast_path/reconcile/model_policy in staffing.py, or to staffing.yaml's
  # tier policy, matched no trigger and would have shipped ungated. This is
  # the same class of gap ESC-002 (item 2) already named for hooks/worker.py;
  # this closes the newer files the addendum itself added to the mechanism.
  - name: governance-mechanism
    keywords: [pretooluse hook, guard_paths, guard_secrets, protect_branches,
              quality-gates.yaml, risk-triggers.yaml, staffing.yaml,
              allowedtools, role_tools, fast_path, baseline_gates]
    paths: ["hooks/**", "config/quality-gates.yaml", "config/risk-triggers.yaml",
           "config/staffing.yaml", "**/worker.py", "**/staffing.py", "**/cli.py"]
    gates: [review, security]

  # 2026-08-24, CTO audit: a version bump in a dependency manifest is the
  # dominant real-world small-diff supply-chain attack shape, and nothing
  # above covered it — a 1-line lockfile edit sailed through fast_path with
  # zero gates. Deliberately path-only (no keyword list): a manifest edit is
  # a manifest edit regardless of what the request text says about it.
  - name: dependency-manifest
    paths: ["**/package.json", "**/package-lock.json", "**/pnpm-lock.yaml",
           "**/yarn.lock", "**/requirements*.txt", "**/Pipfile", "**/Pipfile.lock",
           "**/poetry.lock", "**/go.sum", "**/go.mod", "**/Cargo.toml",
           "**/Cargo.lock", "**/Gemfile", "**/Gemfile.lock"]
    gates: [review, security]

  # A worker with Bash/Write access fetching content it does not control
  # (WebFetch, a webhook payload, third-party MCP/skill output) is the
  # dominant 2026 attack class against coding agents — prompt injection via
  # untrusted content the agent then acts on. "webhooks" above only covers
  # BUILDING a webhook handler; this covers a worker CONSUMING untrusted
  # content as part of its own task.
  - name: untrusted-content
    keywords: [webfetch, fetch url, scrape, third-party content, ingest,
              external content, mcp server, browse, fetch and summarize]
    gates: [review, security]

# Gates applied to every task regardless of trigger.
#
# D10 (efficiency addendum v1, 2026-08-24) made this empty on purpose: review
# would be risk-based like qa/security, not universal. REVERSED 2026-09-14
# (cost audit, Riyan: "i want cost to be lower - without compromising code
# safety") on real evidence, not suspicion — finos alone shipped 8 of 225
# merged tasks with literally zero independent review, ever, including
# TASK-IAM-MODULE-ADMIN-T3-CASEFIX (an authorization RLS function edit) and
# TASK-MODULE-CONTEXT-DEDUP, whose own task brief says "This touches every
# module's core data-loading pattern - needs real review." An untriggered
# task big enough to not qualify for fast_path (Tier 0, PM does it inline,
# genuinely free) was reaching DONE with nobody but its own author having
# looked at it.
#
# This is NOT the same call as D9-11's other efficiency work: those cut
# LAUNCH COUNT (gate-group, role-aware turn budgets) without touching gate
# COVERAGE. This restores coverage. The two are complementary, not in
# tension — an untriggered task now gets one review, bundled into its plan's
# shared gate_group like everything else, so the marginal launch cost is
# small even though the review itself is real.
#
# qa/security stay risk-triggered only, not baseline — D10's reasoning still
# holds for those: most untriggered work has no meaningful correctness
# surface beyond "does it do what it says" (review covers that) and no
# security surface at all. Only a trigger firing adds those two.
baseline_gates: [review]

# Fast path (D9, efficiency addendum v1): a request with zero risk-trigger
# hits and a diff within these bounds is Tier 0 by default — the PM does it
# inline, no staffing pipeline, no gates. This is evaluated by
# `staffing.evaluate()` when the caller supplies file/line counts (e.g.
# `company gates --files-touched N --diff-lines N`); without those counts,
# fast_path only reports whether triggers fired, same as before. Escalating
# past Tier 0 despite fast_path applying needs the same recorded reason a
# gate addition needs — never a default "just in case".
fast_path:
  enabled: true
  max_files_touched: 1
  max_diff_lines: 50
